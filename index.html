<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Free to Play Film · Diyana Bancheva</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Manrope:wght@400;600&display=swap">
<style>
/* Layout: one quiet column, the film as the only object on the page */
:root{--bg:#fbf7f3;--fg:#050805;--muted:#534840;--line:rgba(5,8,5,.14);--frame:#ead9cf;
--display:"Cormorant Garamond",Georgia,serif;--body:"Manrope",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0e0d;--fg:#f3ede7;--muted:#b9aca2;--line:rgba(243,237,231,.16);--frame:#2a2320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e0d;--fg:#f3ede7;--muted:#b9aca2;--line:rgba(243,237,231,.16);--frame:#2a2320;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
main{max-width:1040px;margin:0 auto;padding-block:48px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,52px);line-height:1.05;margin:0;text-wrap:balance}
video{width:100%;max-width:100%;aspect-ratio:16/9;display:block;background:#000;border:1px solid var(--line)}
p{margin:0;max-width:62ch;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;border-top:1px solid var(--line);padding-top:14px;font-size:13px}
.meta b{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
body{margin:0}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Diyana Bancheva · Selected work · Case 05</div>
  <h1>Free to Play, UEFA Euro 2024</h1>
  <video controls playsinline preload="metadata" poster="poster.jpg"><source src="free-to-play-euro-2024.mp4" type="video/mp4"></video>
  <p>The promotional film for Free to Play, Skrill's free match-prediction game, launched alongside the redesigned Sports Corner in June 2024.</p>
  <div class="meta"><div><b>Product</b>Skrill wallet</div><div><b>Length</b>1:09</div><div><b>My role</b>Lead designer on Sports Corner</div></div>
</main>

</body>
</html>
